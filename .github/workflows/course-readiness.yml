name: Course readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-course-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Explore Studio
        uses: actions/checkout@v7
        with:
          # The committed-ZIP guard rebuilds from the artifact's declared
          # provenance commit, which needs the full history to resolve.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node for website-backed lesson checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: course4teen-website/package-lock.json
      - name: Install website dependencies
        working-directory: course4teen-website
        run: npm ci
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify course materials and workspace bootstrap
        run: >-
          python -m pytest -q
          tests/test_lesson_materials.py
          tests/test_lesson_materials_s03_website.py
          tests/test_lesson_materials_s04_website.py
          tests/test_lesson_materials_s05_website.py
          tests/test_lesson_materials_s06_website.py
          tests/test_lesson_materials_s07_website.py
          tests/test_lesson_materials_s08_website.py
          tests/test_lesson_materials_s09_website.py
          tests/test_s09_presentation.py
          tests/test_remaining_trail_presentation.py
          tests/test_s07_presentation.py
          tests/test_lesson_materials_s06_s10.py
          tests/test_lesson_materials_s11_s15.py
          tests/test_lesson_materials_s16_s20.py
          tests/test_lesson_materials_s21_s24.py
          tests/test_lesson_materials_s25.py
          tests/test_lesson_materials_s26.py
          tests/test_lesson_materials_s27.py
          tests/test_lesson_materials_s28.py
          tests/test_lesson_materials_s29.py
          tests/test_lesson_materials_s30.py
          tests/test_classroom_student_workspace.py
          tests/test_computer_readiness.py
          tests/test_onboarding_docs.py
          tests/test_student_command_copy_paste.py
          tests/test_course_kit_update_scenario.py
          tests/test_mission_presentation_contract.py
          tests/test_student_zip.py
          tests/test_public_zip_provenance_guard.py
          tests/test_course_release.py
      - name: Verify the committed public ZIP matches its provenance commit
        run: python3 scripts/verify_public_zip_provenance.py
      - name: Enforce phase-aware Course Kit freshness
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            python scripts/course_release_status.py --pr-base "$PR_BASE"
          else
            python scripts/course_release_status.py
          fi
      - name: Prepare approved candidate and publication handoff
        if: github.event_name == 'pull_request'
        run: |
          SESSION=$(python -c 'from scripts.course_release import load_contract; print(load_contract()["published_session"])')
          python scripts/prepare_course_release.py --session "$SESSION" --export-approved
      - name: Preserve candidate and publication metadata for separate approval
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: course-kit-publication-bundle
          path: build/course-releases/
          if-no-files-found: error
