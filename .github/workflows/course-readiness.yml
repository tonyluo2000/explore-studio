name: Course readiness

on:
  pull_request:
    paths:
      - ".github/workflows/course-readiness.yml"
      - "classroom/**"
      - "docs/classroom-student-workspace.md"
      - "docs/operations/s01-clean-rehearsal-*.md"
      - "docs/curriculum*.md"
      - "lessons/sessions/**"
      - "course4teen-website/public/downloads/explore-studio-course.zip"
      - "scripts/build_student_zip.py"
      - "scripts/provision_student_workspace.py"
      - "scripts/sync_student_downloads.py"
      - "scripts/verify_public_zip_provenance.py"
      - "tests/test_public_zip_provenance_guard.py"
      - "tests/test_student_zip.py"
      - "tests/test_classroom_student_workspace.py"
      - "tests/test_computer_readiness.py"
      - "tests/test_onboarding_docs.py"
      - "tests/test_course_kit_update_scenario.py"
      - "tests/test_mission_presentation_contract.py"
      - "docs/operations/classroom-preflight.md"
      - "course4teen-website/app/students/prepare/**"
      - "course4teen-website/app/students/slides/s05/**"
      - "course4teen-website/lib/calendar.ts"
      - "course4teen-website/lib/courseKit.ts"
      - "course4teen-website/lib/learn.ts"
      - "tests/test_lesson_materials*.py"
      - "examples/explorer-packages/**"
      - "scripts/check_computer_readiness.py"
      - "docs/computer-readiness.md"
      - "docs/windows-wsl-setup.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/course-readiness.yml"
      - "classroom/**"
      - "docs/classroom-student-workspace.md"
      - "docs/operations/s01-clean-rehearsal-*.md"
      - "docs/curriculum*.md"
      - "lessons/sessions/**"
      - "course4teen-website/public/downloads/explore-studio-course.zip"
      - "scripts/build_student_zip.py"
      - "scripts/provision_student_workspace.py"
      - "scripts/sync_student_downloads.py"
      - "scripts/verify_public_zip_provenance.py"
      - "tests/test_public_zip_provenance_guard.py"
      - "tests/test_student_zip.py"
      - "tests/test_classroom_student_workspace.py"
      - "tests/test_computer_readiness.py"
      - "tests/test_onboarding_docs.py"
      - "tests/test_course_kit_update_scenario.py"
      - "tests/test_mission_presentation_contract.py"
      - "docs/operations/classroom-preflight.md"
      - "course4teen-website/app/students/prepare/**"
      - "course4teen-website/app/students/slides/s05/**"
      - "course4teen-website/lib/calendar.ts"
      - "course4teen-website/lib/courseKit.ts"
      - "course4teen-website/lib/learn.ts"
      - "tests/test_lesson_materials*.py"
      - "examples/explorer-packages/**"
      - "scripts/check_computer_readiness.py"
      - "docs/computer-readiness.md"
      - "docs/windows-wsl-setup.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-course-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Explore Studio
        uses: actions/checkout@v7
        with:
          # The committed-ZIP guard rebuilds from the artifact's declared
          # provenance commit, which needs the full history to resolve.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify course materials and workspace bootstrap
        run: >-
          python -m pytest -q
          tests/test_lesson_materials.py
          tests/test_lesson_materials_s03_website.py
          tests/test_lesson_materials_s04_website.py
          tests/test_lesson_materials_s05_website.py
          tests/test_lesson_materials_s06_s10.py
          tests/test_lesson_materials_s11_s15.py
          tests/test_lesson_materials_s16_s20.py
          tests/test_lesson_materials_s21_s24.py
          tests/test_lesson_materials_s25.py
          tests/test_lesson_materials_s26.py
          tests/test_lesson_materials_s27.py
          tests/test_lesson_materials_s28.py
          tests/test_lesson_materials_s29.py
          tests/test_lesson_materials_s30.py
          tests/test_classroom_student_workspace.py
          tests/test_computer_readiness.py
          tests/test_onboarding_docs.py
          tests/test_course_kit_update_scenario.py
          tests/test_mission_presentation_contract.py
          tests/test_student_zip.py
          tests/test_public_zip_provenance_guard.py
      - name: Verify the committed public ZIP matches its provenance commit
        run: python3 scripts/verify_public_zip_provenance.py
