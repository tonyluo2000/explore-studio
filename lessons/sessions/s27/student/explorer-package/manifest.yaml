schema_version: "0.2"

package:
  id: "skyglass-core"
  display_name: "Skyglass Observatory Core"
  version: "0.1.0"

compatibility:
  student_api: "0.1"

toggle_styles:
  - id: "observatory-glow"
    off_color: "blue"
    on_color: "gold"

contributions:
  - id: "echo-lens"
    type: "world_object"
    path: "objects/echo-lens.yaml"
  - id: "wind-dial"
    type: "world_object"
    path: "objects/wind-dial.yaml"
  - id: "comet-bell"
    type: "world_object"
    path: "objects/comet-bell.yaml"
