<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -70 1120 830" width="1120" height="830" role="img" aria-labelledby="s02-map-title s02-map-desc">
  <title id="s02-map-title">S02 Trail map</title>
  <desc id="s02-map-desc">A map of the 960 by 640 Trail screen for S02. Nova, the class example explorer, starts at (430, 270). Pixel, the class example companion, stands at (480, 310). Step 1: walk to the Moon Compass at (240, 180), the tool you place with x and y. Step 2: walk to the Crystal Lantern at (120, 460), the destination in the bottom-left corner. Visiting both world objects completes the mission. In the Trail each thing is a plain colored box; the symbols on this map are only there to help you read it.</desc>
  <!-- Original source-native map for Explore Studio. Boxes use the Trail's real
       sizes, positions, and named colors; symbols and labels are map-only. -->
  <style>
    .tick { fill: #334658; font: 700 22px monospace; }
    .axis { fill: #b04b2b; font: 700 26px monospace; }
    .grid { stroke: rgba(240, 240, 240, 0.12); stroke-width: 2; }
    .hud { fill: rgba(240, 240, 240, 0.72); font: 22px Arial, sans-serif; }
    .zone { fill: rgba(240, 240, 240, 0.45); font: italic 18px Arial, sans-serif; }
    .label { fill: #f0f0f0; font: 700 24px Arial, sans-serif; }
    .note { fill: #cfe9df; font: 20px Arial, sans-serif; }
    .xy { fill: #8ed8bf; font: 700 20px monospace; }
    .route { fill: none; stroke: #8ed8bf; stroke-width: 5; stroke-dasharray: 4 14; stroke-linecap: round; }
    .step { fill: #122131; font: 800 24px Arial, sans-serif; }
    .legend { fill: #122131; font: 20px Arial, sans-serif; }
  </style>

  <!-- The Trail window: 960 x 640, background (32, 32, 48). -->
  <rect x="0" y="0" width="960" height="640" fill="#202030" />
  <g class="grid">
    <line x1="160" y1="0" x2="160" y2="640" /><line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" /><line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="0" y1="160" x2="960" y2="160" /><line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="480" x2="960" y2="480" />
  </g>
  <g class="tick" text-anchor="middle">
    <text x="0" y="-18">0</text><text x="160" y="-18">160</text><text x="320" y="-18">320</text>
    <text x="480" y="-18">480</text><text x="640" y="-18">640</text><text x="800" y="-18">800</text>
    <text x="960" y="-18">960</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="-14" y="167">160</text><text x="-14" y="327">320</text>
    <text x="-14" y="487">480</text><text x="-14" y="647">640</text>
  </g>
  <text class="axis" x="990" y="-16">x →</text>
  <text class="axis" x="-14" y="690" text-anchor="end">y ↓</text>

  <!-- What the Trail itself writes on screen (fixed by the mission). -->
  <text class="hud" x="20" y="40">Visited 0 / 2</text>
  <text class="hud" x="20" y="75">Mission: Create Your First Object</text>
  <text class="zone" x="20" y="130">Mission words stay up here.</text>
  <text class="zone" x="360" y="620">Messages appear here, like “Press E to explore”.</text>

  <!-- Route: start → 1 Moon Compass → 2 Crystal Lantern (the destination). -->
  <path class="route" d="M 480 300 C 420 240 360 220 320 212" />
  <path class="route" d="M 262 240 C 250 330 200 390 170 458" />

  <!-- 2. Crystal Lantern: world object, 80 x 60, yellow. The destination. -->
  <g id="crystal-lantern" data-x="120" data-y="460" data-color="yellow">
    <circle cx="160" cy="490" r="78" fill="none" stroke="#f0d232" stroke-width="3" stroke-dasharray="10 8" opacity="0.8" />
    <rect x="120" y="460" width="80" height="60" fill="rgb(240, 210, 50)" />
    <path d="M160 468 L172 490 L160 512 L148 490 Z" fill="#fff4d6" stroke="#122131" stroke-width="3" />
    <circle cx="100" cy="452" r="18" fill="#8ed8bf" /><text class="step" x="100" y="461" text-anchor="middle">2</text>
    <text class="label" x="250" y="478">Crystal Lantern · the destination</text>
    <text class="note" x="250" y="506">Already in the world. End your trail here.</text>
    <text class="xy" x="250" y="532">(120, 460)</text>
  </g>

  <!-- 1. Moon Compass: YOUR tool, 80 x 60, purple until you change it. -->
  <g id="moon-compass" data-x="240" data-y="180" data-color="purple">
    <rect x="240" y="180" width="80" height="60" fill="rgb(140, 50, 180)" stroke="#f0f0f0" stroke-width="3" stroke-dasharray="8 6" />
    <circle cx="280" cy="210" r="21" fill="#efe6ff" stroke="#122131" stroke-width="3" />
    <path d="M280 193 L286 210 L280 227 L274 210 Z" fill="#b04b2b" />
    <circle cx="220" cy="172" r="18" fill="#8ed8bf" /><text class="step" x="220" y="181" text-anchor="middle">1</text>
    <rect x="20" y="266" width="332" height="88" rx="8" fill="#202030" opacity="0.92" />
    <text class="label" x="30" y="290">Moon Compass · YOU place it</text>
    <text class="note" x="30" y="318">Your tool. You choose x, y, and color.</text>
    <text class="xy" x="30" y="344">(240, 180) → your x and y</text>
  </g>

  <!-- Pixel: class example companion, 100 x 100, blue. Drawn under Nova. -->
  <g id="pixel" data-x="480" data-y="310" data-color="blue">
    <rect x="480" y="310" width="100" height="100" fill="rgb(50, 80, 220)" />
    <line x1="560" y1="388" x2="560" y2="372" stroke="#122131" stroke-width="3" />
    <circle cx="560" cy="368" r="5" fill="#ff8f66" />
    <text class="label" x="600" y="382">Pixel · class example</text>
    <text class="note" x="600" y="408">Says hello when you press E.</text>
    <text class="xy" x="600" y="434">(480, 310)</text>
  </g>

  <!-- Nova: class example explorer and today's player, 100 x 100, gold. -->
  <g id="nova" data-x="430" data-y="270" data-color="gold">
    <rect x="430" y="270" width="100" height="100" fill="rgb(255, 200, 50)" />
    <circle cx="480" cy="306" r="14" fill="#122131" opacity="0.8" />
    <path d="M458 350 Q480 328 502 350 Z" fill="#122131" opacity="0.8" />
    <text class="label" x="600" y="262">Nova · you walk as Nova</text>
    <text class="note" x="600" y="288">Start here. Arrow keys move.</text>
    <text class="xy" x="600" y="314">(430, 270)</text>
  </g>

  <!-- Legend (outside the screen). -->
  <rect x="0" y="715" width="26" height="26" fill="rgb(140, 50, 180)" stroke="#122131" stroke-width="2" stroke-dasharray="6 4" />
  <text class="legend" x="38" y="736">Changes when YOU edit compass.yaml</text>
  <rect x="470" y="715" width="26" height="26" fill="#5b6475" />
  <text class="legend" x="508" y="736">Class example packages: the same for everyone</text>
</svg>
